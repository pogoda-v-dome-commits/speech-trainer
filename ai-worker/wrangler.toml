name = "govori-yasno-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Сайты, которым разрешено обращаться к ИИ (через запятую)
ALLOWED_ORIGINS = "https://pogoda-v-dome-commits.github.io,http://localhost:8767"

# Не больше 5 разборов в минуту с одного IP
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Секреты задаются командой, а не здесь:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put ACCESS_CODE   (необязательно — код доступа для пользователей)
